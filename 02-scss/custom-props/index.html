<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --bg-primary: #09ff00;
            --bg-secondary: #9866e3;
            --w: 200px;
            --h: 200px;
        }

        h1 {
            background-color: var(--bg-primary);
        }

        p {
            background-color: var(--bg-primary);
        }

        div {
            background-color: var(--bg-secondary);
            width: var(--w);
            height: var(--h);
        }
    </style>
</head>

<body>
<h1>SCSS Custom Properties</h1>
<p>This is a paragraph with a background color defined by a custom property.</p>
<div>This is a div with a background color defined by a custom property.</div>
</body>

</html>
