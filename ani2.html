<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        @keyframes blende {
            0%{
                opacity: 1;
                transform: rotate(40deg);
            }
            50%{
                opacity: 0.7;
                transform: rotate(80deg);

            }
            100%{
                opacity: 0;
                transform: rotate(120deg);
            }
        }
        #box {
            width: 100px;
            height: 100px;
            background-color: red;
            position: absolute;
            left: 200px;
            animation: blende 5s infinite alternate;
     
        }




    </style>
</head>

<body>
    <div id="box">text</div>

</body>

</html>
